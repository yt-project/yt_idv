[build-system]
requires = [
  "setuptools>=77",
  "Cython>=3.0.3",
  "numpy>=2.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "yt_idv"
dynamic = ["version"]
description = "Interactive Volume Rendering for yt"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Matthew Turk", email = "matthewturk@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Cython",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "Click>=7.0",
  "cmyt",
  "matplotlib>=3.0",
  "numpy>=1.18.0",
  "pyOpenGL>=3.1.5",
  "pyglet>=2.0.dev0,<3.0.0",
  "pyyaml>=5.3.1",
  "traitlets>=5.0.5",
  "traittypes>=0.2.1",
  "yt>=4.1.0",
]

[project.optional-dependencies]
gui = [
  "imgui>=1.2.0",
]
minimal = [
  "matplotlib<3.10",
  "numpy<2.0",
]
test = [
  "pytest>=6.2.4",
  "pytest-html",
]

[project.urls]
Homepage = "https://github.com/yt-project/yt_idv"
Documentation = "https://yt-idv.readthedocs.io"
Source = "https://github.com/yt-project/yt_idv"
Changelog = "https://github.com/yt-project/yt_idv/blob/main/HISTORY.md"

[project.scripts]
yt_idv = "yt_idv.cli:main"

[tool.setuptools.dynamic]
version = { attr = "yt_idv.__version__" }

[tool.setuptools.packages.find]
include = ["yt_idv", "yt_idv.*"]

[tool.setuptools.package-data]
yt_idv = ["**/*.glsl", "**/*.yaml", "**/*.pyx", "**/*.pxd"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "YTT",  # flake8-2020
  "UP",   # pyupgrade
  "I",    # isort
  "NPY",  # numpy specific rules
]
ignore = [
  "E501",  # line too long, handled by the formatter
  "E741",  # ambiguous variable names like l, I, O
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"examples/*" = ["NPY002"]
"yt_idv/tests/*" = ["NPY002"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
offscreen_backend = "osmesa"
