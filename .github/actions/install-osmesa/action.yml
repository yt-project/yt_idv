name: Install apt packages
description: >
  Install the system libraries used for offscreen rendering (OSMesa or EGL),
  caching the downloaded .deb files so runs do not have to hit the Ubuntu
  archives.

inputs:
  packages:
    description: Space separated list of apt packages to install.
    required: false
    default: libosmesa6-dev

runs:
  using: composite
  steps:
    # ImageOS/ImageVersion are process env vars on hosted runners, not part of
    # the `env` expression context, so they have to be read from a shell.
    - name: Get runner image version
      id: image
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${ImageOS:-}" ] || [ -z "${ImageVersion:-}" ]; then
          echo "ImageOS/ImageVersion not set, cannot build a safe cache key" >&2
          exit 1
        fi
        echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
        echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

    - name: Restore cached apt packages
      id: apt-cache
      uses: actions/cache@v6
      with:
        path: /tmp/osmesa-debs
        key: osmesa-debs-${{ runner.os }}-${{ steps.image.outputs.os }}-${{ steps.image.outputs.version }}-${{ inputs.packages }}

    - name: Download apt packages
      if: steps.apt-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        sudo mkdir -p /tmp/osmesa-debs/partial
        sudo apt-get update
        sudo apt-get install -y --download-only \
          -o Dir::Cache::archives=/tmp/osmesa-debs $PACKAGES
        sudo rm -rf /tmp/osmesa-debs/partial /tmp/osmesa-debs/lock
        sudo chown -R "$(id -u):$(id -g)" /tmp/osmesa-debs

    - name: Install apt packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        debs=(/tmp/osmesa-debs/*.deb)
        if [ ${#debs[@]} -gt 0 ]; then
          sudo dpkg --install "${debs[@]}"
        else
          echo "nothing to install, the runner image already provides $PACKAGES"
        fi
        dpkg-query -W $PACKAGES
