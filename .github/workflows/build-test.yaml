name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        backend: [osmesa, pyglet]
        python-version: ['3.10', '3.11', '3.12']
        exclude:
          # osmesa on macOS would require conda-forge or brew mesa builds
          - os: macos-latest
            backend: osmesa
        include:
          # pyglet needs a display server on linux; macOS runners have a
          # WindowServer session and ubuntu+osmesa is fully headless
          - os: ubuntu-latest
            backend: pyglet
            test-launcher: xvfb-run -a

    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - uses: actions/checkout@v7
    - name: Install osmesa
      if: matrix.backend == 'osmesa'
      uses: ./.github/actions/install-osmesa
    - name: Upgrade pip
      run: python -m pip install --upgrade pip
    - name: Setup yt_idv
      run: python -m pip install -e .[test]
    - name: List final env
      run: python -m pip list
    - name: Run Tests
      env:
          YT_IDV_TEST_BACKEND: ${{ matrix.backend }}
      run: ${{ matrix.test-launcher }} pytest --html=report.html --self-contained-html
    - uses: actions/upload-artifact@v7
      name: Upload pytest report
      with:
        name: pytest-report-${{ matrix.os }}-${{ matrix.backend }}-py-${{ matrix.python-version }}
        path: report.html
